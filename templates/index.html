<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="FF Like API — Secure Access" />
<title>FF LIKE API — Access Terminal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />
</head>
<body data-panel="login" data-no-realtime="1">

<!-- Matrix rain background -->
<canvas id="matrix"></canvas>

<!-- Grid overlay -->
<div class="grid-overlay"></div>

<!-- Scanlines -->
<div class="scanlines"></div>

<!-- Floating orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- Login Wrapper -->
<main class="login-wrap">

  <!-- Terminal Header -->
  <header class="terminal-head">
    <div class="dot-group">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
    </div>
    <span class="term-title">ff-like-api — auth@terminal:~$</span>
    <span class="term-status" id="clock">--:--:--</span>
  </header>

  <!-- Login Card -->
  <section class="card">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">🔥</div>
      <div class="brand-text">
        <h1>FF LIKE API</h1>
        <p>SECURE ACCESS TERMINAL</p>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider">
      <span>⟪ AUTHENTICATION REQUIRED ⟫</span>
    </div>

    <!-- Form -->
    <form id="loginForm" autocomplete="off">

      <div class="field">
        <label for="name">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Username
        </label>
        <input id="name" name="name" type="text" placeholder="enter username" required autofocus />
      </div>

      <div class="field">
        <label for="password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Password
        </label>
        <div class="input-wrap">
          <input id="password" name="password" type="password" placeholder="enter password" required />
          <button type="button" class="toggle-pw" data-target="password" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="key">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          <span id="keyLabel">Access Key</span>
        </label>
        <div class="input-wrap">
          <input id="key" name="key" type="password" placeholder="enter access key" />
          <button type="button" class="toggle-pw" data-target="key" aria-label="Show key">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="hint" id="keyHint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          Owner/Admin/User — enter your assigned key
        </p>
      </div>

      <!-- 🔥 Remember Me -->
      <div class="remember-row">
        <label class="checkbox-wrap">
          <input type="checkbox" id="rememberMe" />
          <span class="checkbox-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </span>
          <span class="checkbox-label">Remember me</span>
        </label>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">
        <span class="btn-text">AUTHENTICATE</span>
        <span class="btn-loader">
          <span></span><span></span><span></span>
        </span>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>

      <!-- Error display -->
      <div class="error-box" id="errorBox" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
        <span id="errorText">Authentication failed</span>
      </div>

      <!-- Success display -->
      <div class="success-box" id="successBox" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
        <span id="successText">Access granted. Redirecting…</span>
      </div>

    </form>

    <!-- Footer -->
    <footer class="card-footer">
      <span>v1.0.0</span>
      <span class="sep">|</span>
      <span>OB55</span>
      <span class="sep">|</span>
      <span class="pulse-dot"></span>
      <span>SECURE</span>
    </footer>

  </section>

  <!-- Terminal output log -->
  <div class="term-log" id="termLog">
    <div class="term-line">[boot] system initialized</div>
    <div class="term-line">[boot] waiting for credentials…</div>
  </div>

</main>
<script src="{{ url_for('static', filename='js/themes.js') }}"></script>
<script src="{{ url_for('static', filename='js/realtime.js') }}"></script>
<script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
